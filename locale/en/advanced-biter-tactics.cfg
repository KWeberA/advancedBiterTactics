[advanced-biter-tactics]
command-help-debug=Admin command for Advanced Biter Tactics debug tools. Usage: /abt-debug on|off|status|dump|clear
command-help-arena=Admin command that rebuilds and teleports you into a reproducible Advanced Biter Tactics arena. Usage: /abt-debug-arena wall-open|wall-covered-flank|closed-ring|spitter-siege|mixed-breach-siege|mixed-turret-breach|flame-turret-breach|breach-reuse
debug-help=Advanced Biter Tactics admin tools: turn capture on or off, print status, refresh snapshot files with support-mode telemetry, or clear transient debug data and script-output.
debug-arena-help=Advanced Biter Tactics arena command: rebuilds the arena map, teleports you there, and runs wall-open|wall-covered-flank|closed-ring|spitter-siege|mixed-breach-siege|mixed-turret-breach|flame-turret-breach|breach-reuse. Check the follow-up hint for which standoff, cone-siege, or breach-reuse behavior the arena is proving.
debug-not-admin=Only admins can use Advanced Biter Tactics debug commands.
debug-enabled=Advanced Biter Tactics debug capture enabled for you.
debug-enabled-server=Advanced Biter Tactics debug capture enabled for the server console.
debug-disabled=Advanced Biter Tactics debug capture disabled for you.
debug-disabled-server=Advanced Biter Tactics debug capture disabled for the server console.
debug-dumped=Advanced Biter Tactics refreshed __1__, appends to __2__, and keeps the arena manifest in script-output.
debug-cleared=Advanced Biter Tactics cleared transient debug data and overlay markers.
debug-arena-created=Advanced Biter Tactics arena '__1__' is ready on __2__. Spawn (__3__, __4__), target (__5__, __6__).
debug-arena-expected=Advanced Biter Tactics expectation: __1__
debug-arena-support-mode=Advanced Biter Tactics expected support mode: __1__
debug-arena-wave-count=Advanced Biter Tactics expected wave count: __1__
status-summary=Advanced Biter Tactics debug: players=__1__ tracked-groups=__2__ active-groups=__3__ siege-sites=__4__
status-event=Advanced Biter Tactics tick __1__: __2__ group=__3__ state=__4__ target=(__5__, __6__)
