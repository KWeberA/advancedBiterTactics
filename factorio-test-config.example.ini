; version=13
; Copy this file to factorio-test-config.ini and replace the write-data path
; with a local absolute path that points to a repo-ignored workspace folder
; such as <repo>/.factorio-test/user-data.
[path]
read-data=__PATH__system-read-data__
write-data=<ABSOLUTE_WRITE_DATA_PATH>

[other]
verbose-logging=true
